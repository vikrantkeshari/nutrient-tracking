<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutrient Tracking — Simple</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C10; --card:#191C24; --card2:#232732;
  --line:rgba(255,255,255,.14);
  --accent:#A78BFA;
  --cal:#22D3EE; --pro:#34D399; --carb:#FBBF24; --fat:#F87171;
  /* high-contrast text only — no low-contrast greys */
  --t1:#FFFFFF; --t2:#D5DAE3;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;font-family:Outfit,system-ui,sans-serif;color:var(--t1);line-height:1.5;font-size:18px}
.phone{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;padding-bottom:calc(104px + var(--safe))}
.scroll{flex:1;overflow-y:auto}
::-webkit-scrollbar{width:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.pad{padding:26px 20px 10px}
.stack{display:flex;flex-direction:column;gap:16px;padding:0 20px 24px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700;margin-bottom:16px}
.day{font-size:1.05rem;color:var(--t2);font-weight:600;margin-top:4px}
.lab{font-size:1.05rem;color:var(--t2);font-weight:600}

/* big tap targets everywhere */
button{font-family:inherit;cursor:pointer;border:none}
.big{width:100%;min-height:68px;border-radius:16px;background:var(--accent);color:#12101A;font-size:1.25rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px}
.big.alt{background:var(--card2);color:var(--t1);border:2px solid var(--line)}
.big:active{transform:scale(.98)}

/* nav: 4 items, large, always labelled */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;
  height:calc(100px + var(--safe));padding-bottom:var(--safe);background:#12141B;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;z-index:50}
.nav button{background:none;color:var(--t2);font-size:.95rem;font-weight:700;display:flex;flex-direction:column;
  align-items:center;gap:6px;flex:1;height:100%;justify-content:center}
.nav button.on{color:var(--accent)}
.nav .add{flex:0 0 92px;background:var(--accent);color:#12101A;height:76px;border-radius:20px;font-size:.95rem;gap:2px}
svg.i{width:30px;height:30px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* progress */
.bigbar{height:22px;background:rgba(255,255,255,.1);border-radius:11px;overflow:hidden}
.bigbar>div{height:100%;border-radius:11px}
.mbar{height:14px;background:rgba(255,255,255,.1);border-radius:7px;overflow:hidden;margin-top:8px}
.mbar>div{height:100%;border-radius:7px}
.mrow+.mrow{margin-top:20px}

.item{padding:18px 0}
.item+.item{border-top:1px solid var(--line)}
.name{font-size:1.15rem;font-weight:700}
.meta{font-size:1rem;color:var(--t2);margin-top:5px;font-weight:600}

.person{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;flex-shrink:0}

.tag{display:inline-block;font-size:.95rem;font-weight:700;padding:7px 14px;border-radius:10px;background:var(--card2);color:var(--t2);border:1px solid var(--line)}
.tag.on{background:rgba(167,139,250,.2);color:#DDD2FF;border-color:rgba(167,139,250,.45)}

.choice{width:100%;min-height:76px;border-radius:14px;background:var(--card2);border:2px solid var(--line);
  color:var(--t1);font-size:1.15rem;font-weight:700;text-align:left;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.choice.on{background:rgba(167,139,250,.18);border-color:var(--accent);color:#fff}

input{width:100%;min-height:64px;padding:0 18px;background:#0E1014;border:2px solid var(--line);
  border-radius:14px;color:var(--t1);font-family:inherit;font-size:1.35rem;font-weight:700;outline:none}
input:focus{border-color:var(--accent)}
textarea{width:100%;padding:18px;background:#0E1014;border:2px solid var(--line);border-radius:14px;
  color:var(--t1);font-family:inherit;font-size:1.15rem;outline:none;resize:none}

.note{font-size:1rem;color:var(--t2);line-height:1.6;font-weight:500}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:0}to{opacity:1}}
.demo{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99;display:flex;gap:6px;
  background:#232732;border:1px solid var(--line);border-radius:22px;padding:5px}
.demo button{background:none;color:var(--t2);font-size:.85rem;font-weight:700;padding:8px 16px;border-radius:18px}
.demo button.on{background:var(--accent);color:#12101A}
</style>
</head>
<body>

<div class="demo">
  <button id="d1" class="on" onclick="setG(1)">1 group</button>
  <button id="d3" onclick="setG(3)">3 groups</button>
</div>

<div class="phone">
  <div class="scroll" id="view"></div>
  <div class="nav" id="nav"></div>
</div>

<script>
const S={
  tab:'today', gCount:1, gi:0, step:'pick', mode:'photo', me:'Vikrant',
  goals:{cal:2200,pro:165,carb:230,fat:73},
  now:{cal:1420,pro:98,carb:142,fat:47},
  meals:[
    {n:'Grilled Chicken & Quinoa',c:520,p:48,cb:52,f:12,t:'1:15 PM'},
    {n:'Yogurt & Berries',c:210,p:20,cb:24,f:5,t:'10:30 AM'},
    {n:'Oats & Two Eggs',c:690,p:30,cb:66,f:30,t:'8:05 AM'}
  ],
  groups:[
    {name:'Family',code:'FAM-7K2X9M',mine:'meals',members:[
      {n:'Priya',lvl:'meals',cal:1180,p:72,cb:120,f:41,meals:[{n:'Paneer Salad',c:410,t:'1:40 PM'},{n:'Poha & Chai',c:340,t:'8:30 AM'}]},
      {n:'Dad',lvl:'totals',cal:1890,p:104,cb:210,f:62,meals:[]},
      {n:'Liam',lvl:'none',cal:null,meals:[]}]},
    {name:'Gym Friends',code:'GYM-4B8QZ1',mine:'totals',members:[
      {n:'Rahul',lvl:'totals',cal:2640,p:198,cb:242,f:78,meals:[]},
      {n:'Sneha',lvl:'totals',cal:1720,p:141,cb:150,f:52,meals:[]}]},
    {name:'Office',code:'OFF-9W3RT6',mine:'none',members:[
      {n:'Meera',lvl:'totals',cal:1540,p:88,cb:168,f:49,meals:[]},
      {n:'Tom',lvl:'none',cal:null,meals:[]}]}
  ]
};
const ic={
  today:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  groups:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/>',
  me:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  txt:'<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  chev:'<path d="M9 18l6-6-6-6"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  check:'<path d="M20 6L9 17l-5-5"/>'
};
const I=(k,s=30)=>`<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${ic[k]}</svg>`;
const P=(a,b)=>Math.min(a/b*100,100);
const C={cal:'var(--cal)',pro:'var(--pro)',carb:'var(--carb)',fat:'var(--fat)'};

/* ---------- TODAY : one big number, plain bars ---------- */
function today(){
  const g=S.goals,n=S.now,left=g.cal-n.cal;
  const m=(lbl,v,gl,c)=>`<div class="mrow">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-size:1.15rem;font-weight:700;color:${c}">${lbl}</span>
      <span class="lab">${v} of ${gl}g</span></div>
    <div class="mbar"><div style="width:${P(v,gl)}%;background:${c}"></div></div></div>`;

  const gcards=S.groups.slice(0,S.gCount).map((gr,i)=>{
    const vis=gr.members.filter(x=>x.lvl!=='none');
    if(!vis.length)return'';
    return `<div class="card" onclick="open_(${i})">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="margin:0">${gr.name}</h2><span style="color:var(--t2)">${I('chev',24)}</span></div>
      ${vis.map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0">
        <span style="font-size:1.1rem;font-weight:600">${x.n}</span>
        <span style="font-size:1.1rem;font-weight:800;color:var(--cal)">${x.cal} kcal</span></div>`).join('')}
    </div>`}).join('');

  return `<div class="fade">
    <div class="pad"><h1>Hello, ${S.me}</h1>
      <div class="day">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div></div>
    <div class="stack">

      <div class="card" style="text-align:center;padding:28px 22px">
        <div class="lab">You have eaten</div>
        <div style="font-size:4rem;font-weight:800;color:var(--cal);line-height:1.1;margin:6px 0">${n.cal}</div>
        <div class="lab" style="margin-bottom:20px">of ${g.cal} calories</div>
        <div class="bigbar"><div style="width:${P(n.cal,g.cal)}%;background:var(--cal)"></div></div>
        <div style="font-size:1.3rem;font-weight:800;margin-top:18px;color:var(--pro)">${left} calories left today</div>
      </div>

      <div class="card">
        <h2>Protein, carbs and fat</h2>
        ${m('Protein',n.pro,g.pro,C.pro)}${m('Carbs',n.carb,g.carb,C.carb)}${m('Fat',n.fat,g.fat,C.fat)}
      </div>

      <div class="card">
        <h2>What you ate today</h2>
        ${S.meals.map(x=>`<div class="item">
          <div class="name">${x.n}</div>
          <div class="meta">${x.t} &nbsp;·&nbsp; ${x.c} calories</div></div>`).join('')}
      </div>

      ${gcards}
    </div></div>`;
}

/* ---------- GROUPS ---------- */
function picker(){
  return `<div class="fade">
    <div class="pad"><h1>Groups</h1><div class="day">Tap a group to see it</div></div>
    <div class="stack">
      ${S.groups.slice(0,S.gCount).map((g,i)=>`
        <button class="choice" style="min-height:96px" onclick="open_(${i})">
          <span class="person">
            <span class="av" style="background:rgba(167,139,250,.2);border-color:rgba(167,139,250,.4)">${g.name[0]}</span>
            <span><span style="display:block;font-size:1.3rem">${g.name}</span>
            <span style="display:block;font-size:1rem;color:var(--t2);font-weight:600;margin-top:2px">${g.members.length} people</span></span>
          </span>
          <span style="color:var(--t2)">${I('chev',26)}</span>
        </button>`).join('')}
      <button class="big alt">Join a group</button>
    </div></div>`;
}

function group(){
  const g=S.groups[S.gi], multi=S.gCount>1;
  const meals=g.members.filter(m=>m.lvl==='meals');
  const tot=g.members.filter(m=>m.lvl==='totals');
  const non=g.members.filter(m=>m.lvl==='none');

  return `<div class="fade">
    <div class="pad">
      ${multi?`<button class="big alt" style="width:auto;min-height:52px;padding:0 20px;font-size:1.05rem;margin-bottom:18px" onclick="S.tab='groups';R()">${I('back',22)} Back</button>`:''}
      <h1>${g.name}</h1><div class="day">${g.members.length} people</div></div>
    <div class="stack">

      ${meals.map(m=>`<div class="card">
        <div class="person" style="margin-bottom:18px">
          <span class="av">${m.n[0]}</span>
          <span><span style="display:block;font-size:1.3rem;font-weight:700">${m.n}</span>
          <span style="display:block;font-size:1.05rem;color:var(--t2);font-weight:600">${m.cal} calories today</span></span>
        </div>
        ${m.meals.map(x=>`<div class="item"><div class="name">${x.n}</div>
          <div class="meta">${x.t} &nbsp;·&nbsp; ${x.c} calories</div></div>`).join('')}
      </div>`).join('')}

      ${tot.map(m=>`<div class="card">
        <div class="person" style="margin-bottom:18px">
          <span class="av">${m.n[0]}</span>
          <span><span style="display:block;font-size:1.3rem;font-weight:700">${m.n}</span>
          <span style="display:block;font-size:1.05rem;color:var(--t2);font-weight:600">Shares totals only</span></span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px">
          <span class="lab">Calories</span>
          <span style="font-size:1.9rem;font-weight:800;color:var(--cal)">${m.cal}</span></div>
        <div style="display:flex;gap:20px">
          ${[['Protein',m.p,C.pro],['Carbs',m.cb,C.carb],['Fat',m.f,C.fat]].map(([l,v,c])=>
          `<div style="flex:1"><div style="font-size:1rem;color:var(--t2);font-weight:600">${l}</div>
           <div style="font-size:1.3rem;font-weight:800;color:${c}">${v}g</div></div>`).join('')}
        </div></div>`).join('')}

      ${non.length?`<div class="card">
        ${non.map(m=>`<div class="person" style="padding:8px 0">
          <span class="av" style="opacity:.55">${m.n[0]}</span>
          <span style="flex:1"><span style="display:block;font-size:1.15rem;font-weight:700">${m.n}</span>
          <span style="display:block;font-size:1rem;color:var(--t2);font-weight:600">Not sharing</span></span>
          <span style="color:var(--t2)">${I('lock',24)}</span></div>`).join('')}
      </div>`:''}

      <div class="card" style="background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.35)">
        <div style="display:flex;gap:14px;align-items:flex-start">
          <span style="color:var(--accent);flex-shrink:0">${I('lock',26)}</span>
          <div><div style="font-size:1.1rem;font-weight:700;margin-bottom:6px">Your photos stay private</div>
          <div class="note">Nobody in this group can see your meal photos. They only see the numbers.</div></div>
        </div></div>
    </div></div>`;
}

/* ---------- ADD A MEAL : 2 choices, then confirm ---------- */
function add(){
  if(S.step==='wait')return `<div class="fade" style="padding:120px 30px;text-align:center">
    <div style="width:76px;height:76px;margin:0 auto 26px;border-radius:50%;border:5px solid rgba(167,139,250,.25);border-top-color:var(--accent);animation:sp 1s linear infinite"></div>
    <div style="font-size:1.5rem;font-weight:800">Looking at your food…</div>
    <div class="note" style="margin-top:10px;font-size:1.1rem">This takes a few seconds</div>
    <style>@keyframes sp{to{transform:rotate(360deg)}}</style></div>`;

  if(S.step==='check')return check();

  if(S.step==='pick')return `<div class="fade">
    <div class="pad"><h1>Add a meal</h1><div class="day">Choose one</div></div>
    <div class="stack">
      <button class="big" style="min-height:150px;flex-direction:column;gap:14px;font-size:1.5rem"
        onclick="S.mode='photo';S.step='shot';R()">${I('cam',52)} Take a photo</button>
      <button class="big alt" style="min-height:150px;flex-direction:column;gap:14px;font-size:1.5rem"
        onclick="S.mode='text';S.step='shot';R()">${I('txt',52)} Type what you ate</button>
    </div></div>`;

  // capture / type
  return `<div class="fade">
    <div class="pad">
      <button class="big alt" style="width:auto;min-height:52px;padding:0 20px;font-size:1.05rem;margin-bottom:18px" onclick="S.step='pick';R()">${I('back',22)} Back</button>
      <h1>${S.mode==='photo'?'Take a photo':'Type what you ate'}</h1></div>
    <div class="stack">
      ${S.mode==='photo'
        ? `<div class="card" style="padding:0;overflow:hidden">
             <div style="aspect-ratio:1;background:#0E1014;display:flex;flex-direction:column;
               align-items:center;justify-content:center;gap:16px;color:var(--t2)">
               ${I('cam',64)}<div style="font-size:1.15rem;font-weight:700">Point at your plate</div></div></div>`
        : `<div class="card"><textarea rows="5" placeholder="Two rotis, dal and a bowl of curd"></textarea>
           <div class="note" style="margin-top:14px">Write it the way you would say it.</div></div>`}
      <button class="big" style="min-height:76px" onclick="S.step='wait';R();setTimeout(()=>{S.step='check';R()},1500)">
        ${S.mode==='photo'?'Take photo':'Done'}</button>
    </div></div>`;
}

function check(){
  const f=(l,v,u,c)=>`<div style="margin-top:20px">
    <div class="lab" style="margin-bottom:8px;color:${c}">${l}</div>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="big alt" style="width:64px;min-height:64px;font-size:1.8rem;flex:0 0 64px">−</button>
      <input value="${v}" style="text-align:center">
      <button class="big alt" style="width:64px;min-height:64px;font-size:1.8rem;flex:0 0 64px">+</button>
    </div></div>`;
  return `<div class="fade">
    <div class="pad"><h1>Is this right?</h1><div class="day">Change anything that looks wrong</div></div>
    <div class="stack">
      <div class="card">
        <div class="lab" style="margin-bottom:8px">We think this is</div>
        <input value="Grilled Chicken & Quinoa" style="font-size:1.2rem">
        ${f('Calories',520,'kcal','var(--cal)')}
        ${f('Protein (g)',48,'g','var(--pro)')}
        ${f('Carbs (g)',52,'g','var(--carb)')}
        ${f('Fat (g)',12,'g','var(--fat)')}
      </div>
      <button class="big" style="min-height:76px" onclick="S.step='pick';S.tab='today';R()">${I('check',26)} Save</button>
      <button class="big alt" onclick="S.step='pick';R()">Start over</button>
    </div></div>`;
}

/* ---------- ME ---------- */
function me(){
  const opt=(i,k,lbl,desc)=>`<button class="choice ${S.groups[i].mine===k?'on':''}"
    style="min-height:88px;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:16px 20px"
    onclick="S.groups[${i}].mine='${k}';R()">
    <span style="display:flex;align-items:center;gap:10px;width:100%">
      <span style="flex:1">${lbl}</span>
      ${S.groups[i].mine===k?`<span style="color:var(--accent)">${I('check',24)}</span>`:''}
    </span>
    <span style="font-size:.98rem;color:var(--t2);font-weight:600">${desc}</span></button>`;

  const goal=(l,k)=>`<div style="margin-top:18px"><div class="lab" style="margin-bottom:8px">${l}</div>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="big alt" style="width:64px;min-height:64px;font-size:1.8rem;flex:0 0 64px">−</button>
      <input value="${S.goals[k]}" style="text-align:center">
      <button class="big alt" style="width:64px;min-height:64px;font-size:1.8rem;flex:0 0 64px">+</button></div></div>`;

  return `<div class="fade">
    <div class="pad"><h1>My settings</h1></div>
    <div class="stack">
      <div class="card person">
        <span class="av" style="width:64px;height:64px;font-size:1.6rem;background:rgba(167,139,250,.2);border-color:rgba(167,139,250,.4)">${S.me[0]}</span>
        <span><span style="display:block;font-size:1.35rem;font-weight:800">${S.me}</span>
        <span style="display:block;font-size:1rem;color:var(--t2);font-weight:600">vikrant.k397@gmail.com</span></span>
      </div>

      <div class="card">
        <h2>My daily goals</h2>
        ${goal('Calories','cal')}${goal('Protein (g)','pro')}${goal('Carbs (g)','carb')}${goal('Fat (g)','fat')}
      </div>

      ${S.groups.slice(0,S.gCount).map((g,i)=>`<div class="card">
        <h2>What ${g.name} can see</h2>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${opt(i,'meals','Every meal I eat','They see each meal and its numbers')}
          ${opt(i,'totals','Only my daily total','They see one total per day, not each meal')}
          ${opt(i,'none','Nothing at all','They see my name only')}
        </div>
        <div class="note" style="margin-top:16px">Photos are never shared, whichever you choose.</div>
      </div>`).join('')}

      <div class="card">
        <h2>Photos</h2>
        <div class="note">Meal photos are deleted after 30 days. Your food history is kept.</div>
      </div>

      <button class="big alt" style="color:var(--fat)">Sign out</button>
    </div></div>`;
}

/* ---------- shell ---------- */
function nav(){
  const b=(k,i,l)=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';toTop();R()">${I(i)}<span>${l}</span></button>`;
  const gOn=S.tab==='groups'||S.tab==='group';
  return `${b('today','today','Today')}
    <button class="${gOn?'on':''}" onclick="openGroups()">${I('groups')}<span>Groups</span></button>
    <button class="add" onclick="S.step='pick';S.tab='add';toTop();R()">${I('plus',30)}<span>Add</span></button>
    ${b('me','me','Me')}`;
}
function openGroups(){ S.gCount===1 ? (S.gi=0,S.tab='group') : S.tab='groups'; toTop();R(); }
function open_(i){ S.gi=i;S.tab='group';toTop();R(); }
function toTop(){const s=document.querySelector('.scroll');if(s)s.scrollTop=0}
function setG(n){S.gCount=n;S.gi=0;
  document.getElementById('d1').className=n===1?'on':'';
  document.getElementById('d3').className=n===3?'on':'';
  if(S.tab==='group'||S.tab==='groups')openGroups();else R();}
function R(){
  document.getElementById('view').innerHTML=({today,groups:picker,group,add,me})[S.tab]();
  document.getElementById('nav').innerHTML=nav();
}
R();
</script>
</body>
